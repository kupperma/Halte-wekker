name: Build Android app

on:
  push:
    branches: [main, "claude/**"]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

# One run at a time per branch, none cancelled: two pushes to main must not race on the releases.
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      # Without the release key a test build is signed with a debug key: kept between runs, so test builds at least
      # update each other.
      - name: Keep the debug key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1
      - name: Unit tests
        run: ./gradlew --no-daemon testReleaseUnitTest
      - name: Release signing key (from the repository secrets, when there)
        id: key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "file=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"
            echo "signed=yes" >> "$GITHUB_OUTPUT"
            echo "Signing with the release key."
          else
            echo "signed=no" >> "$GITHUB_OUTPUT"
            echo "::warning::No ANDROID_KEYSTORE_B64 secret: a test build signed with a debug key (reinstall needed later)."
          fi
      - name: Build release APK
        env:
          HW_KEYSTORE_FILE: ${{ steps.key.outputs.file }}
          HW_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          HW_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          HW_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk Haltewekker.apk
          ls -la Haltewekker.apk
          rm -f "$RUNNER_TEMP/release.jks"
      - name: Check the APK's signature
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs Haltewekker.apk | grep -E "Signer #1 certificate (DN|SHA-256)"
      - name: Version
        id: version
        run: |
          V=$(sed -n -E 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([0-9A-Za-z.]+)".*$/\1/p' app/build.gradle.kts | head -1)
          C=$(sed -n -E 's/^[[:space:]]*versionCode[[:space:]]*=[[:space:]]*([0-9]+).*$/\1/p' app/build.gradle.kts | head -1)
          test -n "$V" && test -n "$C"
          echo "name=$V" >> "$GITHUB_OUTPUT"
          echo "code=$C" >> "$GITHUB_OUTPUT"
          echo "Version $V ($C)"
      - uses: actions/upload-artifact@v4
        with:
          name: Haltewekker-${{ steps.version.outputs.name }}-apk
          path: android/Haltewekker.apk
          retention-days: 14
      - name: Release notes
        run: |
          {
            echo "Android app ${{ steps.version.outputs.name }} (version code ${{ steps.version.outputs.code }}). Built from ${GITHUB_SHA}."
            echo
            if [ "${{ steps.key.outputs.signed }}" = "yes" ]; then
              echo "Install Haltewekker.apk, or add this repository to Obtainium (it tracks these releases)."
            else
              echo "**Test build (unsigned key — reinstall needed later).** Signed with a debug key: once the release key is"
              echo "set up, uninstall this build before installing a signed one."
            fi
          } > notes.md
          cat notes.md
      - name: Publish versioned release (kept, to fall back to)
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.version.outputs.name }}"
          TITLE="Android app $V"
          if [ "${{ steps.key.outputs.signed }}" != "yes" ]; then TITLE="$TITLE (test build)"; fi
          gh release view "android-v$V" >/dev/null 2>&1 || gh release create "android-v$V" Haltewekker.apk --target "${GITHUB_SHA}" --title "$TITLE" --notes-file notes.md
      - name: Publish the rolling latest-android release
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-android -y --cleanup-tag 2>/dev/null || true
          gh release create latest-android Haltewekker.apk --target "${GITHUB_SHA}" --title "Android app (latest)" --notes-file notes.md --prerelease
