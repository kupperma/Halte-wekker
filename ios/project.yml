name: Haltewekker
options:
  bundleIdPrefix: nl.haltewekker
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    MARKETING_VERSION: "0.42.12"
    CURRENT_PROJECT_VERSION: "152"
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
targets:
  Haltewekker:
    type: application
    platform: iOS
    sources: [App, Shared]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Haltewekker
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIBackgroundModes: [location, audio, fetch]
        BGTaskSchedulerPermittedIdentifiers: [nl.haltewekker.app.plan]
        NSLocationWhenInUseUsageDescription: Haltewekker uses your location to wake you before your stop.
        NSLocationAlwaysAndWhenInUseUsageDescription: Haltewekker keeps following you while the phone is locked, so it can wake you before your stop.
        NSSupportsLiveActivities: true
        NSAppleMusicUsageDescription: Haltewekker shows the song you’re playing on the ride screen and the lock screen and, if you turn it on, shares it with your friends while you travel.
        NSCalendarsFullAccessUsageDescription: Haltewekker reads your school timetable (only the calendars you pick) to plan the trip to your first class and set your wake-up alarm.
        NSCalendarsUsageDescription: Haltewekker reads your school timetable (only the calendars you pick) to plan the trip to your first class and set your wake-up alarm.
        NSAlarmKitUsageDescription: Haltewekker wakes you for school, an hour before you have to leave for your first class.
        NSCameraUsageDescription: Haltewekker uses the camera to scan a friend’s code when you add them as a friend, and to scan the barcode on food.
        NSMotionUsageDescription: Haltewekker uses Motion & Fitness to notice sooner when you get on a bus or train, and to save battery while you wait at a stop.
        UIDesignRequiresCompatibility: true
        CFBundleURLTypes:
          - CFBundleURLName: nl.haltewekker.app
            CFBundleURLSchemes: [haltewekker]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIAppFonts: [OldStandard-Bold.ttf, OldStandard-Regular.ttf, CourierPrime-Regular.ttf, CourierPrime-Bold.ttf]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.haltewekker.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: HaltewekkerWidget
  HaltewekkerWidget:
    type: app-extension
    platform: iOS
    sources: [Widget, Shared]
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Haltewekker
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIAppFonts: [OldStandard-Bold.ttf, OldStandard-Regular.ttf, CourierPrime-Regular.ttf, CourierPrime-Bold.ttf]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.haltewekker.app.widget
  HaltewekkerTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests, App/RecompMath.swift, App/RecompModel.swift, App/RecompCheck.swift, App/OpenFoodFacts.swift, App/RecompStore.swift, App/Net.swift, App/Memo.swift, App/Snapshots.swift, App/Geo.swift, App/VehicleMatch.swift, App/ChooseGPS.swift, App/OnBoardRules.swift, App/FieldLog.swift, App/NearPick.swift, App/RideGuards.swift, App/LiveTimes.swift, App/Power.swift, App/ChangeRoom.swift, App/Places.swift, App/MapLogic.swift, App/VehiclePick.swift, App/DepartureGroups.swift, App/DayTimeline.swift, App/SchoolArrive.swift, App/PlanCompare.swift, App/NextTrip.swift, App/RideAhead.swift, App/RideBar.swift, App/MapTap.swift, App/RealPositions.swift, App/PlanChoice.swift, App/RidePick.swift, Shared/VehicleKind.swift, Shared/TripAttributes.swift, App/StopLabel.swift, App/BatteryLog.swift, App/Thrift.swift, App/OutfitWords.swift, App/Profile.swift, App/ManualWeek.swift, App/RoleLogic.swift, App/RoleWords.swift, App/RoleMove.swift, App/SchoolHints.swift, App/SchoolCatalog.swift, App/SetupLogic.swift, App/SetupBackup.swift, App/Schools.json, App/NSCodes.swift, App/NSStations.json, App/NearestStation.swift, App/RoleRegions.swift, App/DoorScore.swift, App/ScoreRules.swift, App/DailyRank.swift, App/TravelYear.swift, App/NoticeExpiry.swift, App/WristNotice.swift, App/AlarmStop.swift, App/Approach.swift, App/FriendWords.swift, App/FriendKeys.swift, App/FriendBox.swift, App/FriendBook.swift, App/FriendInbox.swift, App/FriendTravel.swift, App/BoardAt.swift, App/FriendChat.swift, App/FriendGroup.swift, App/FriendTripCard.swift, App/FriendTimetable.swift, App/FriendCompare.swift, App/FriendRides.swift, App/LogShare.swift, App/GPSShare.swift, App/FriendExtras.swift, App/FriendExtrasB.swift, App/LiveLink.swift, App/LiveTripV2.swift, App/TestFriendBrain.swift, App/SeatMap.swift, App/SeatClass.swift, App/MapFrame.swift, App/SettingsIndex.swift, App/WakeRule.swift, App/MotionRules.swift, App/TrainRules.swift, App/BetterStop.swift, App/DeadReckon.swift, App/Habits.swift, App/PickRules.swift, App/ChangeOdds.swift, App/StudentOV.swift, App/TravelHelp.swift, App/RailWorks.swift, App/OVFiets.swift, App/RainAdvice.swift, App/IntentActions.swift, Shared/StopBoardCore.swift, App/ChangeGuide.swift, App/MissCall.swift, App/ShortLeg.swift, App/AdaptiveWake.swift, App/GetReady.swift, App/RideCache.swift, App/WrongBus.swift, App/GhostDepartures.swift, App/StickyTrips.swift, App/BusFusion.swift, App/RealFirst.swift, App/WalkPlan.swift, App/FromStop.swift, App/WalkGuide.swift, App/NearbyRank.swift, App/NearbyLive.swift, App/PlanFix.swift, App/TripTimeline.swift, App/WaitStart.swift, App/PlatformWatch.swift, App/MusicShare.swift, ../docs/music-vectors.json, ../docs/live-link-vectors.json, App/DoorSide.swift, ../docs/door-side-vectors.json, App/RideSaver.swift, ../docs/battery-vectors.json]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.haltewekker.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Haltewekker:
    build:
      targets:
        Haltewekker: all
  HaltewekkerTests:
    build:
      targets:
        HaltewekkerTests: [test]
    test:
      targets: [HaltewekkerTests]
