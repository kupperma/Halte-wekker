<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Old+Standard+TT:wght@700&family=Courier+Prime&display=block"><style>html,body{margin:0;background:#000}</style></head><body>
<canvas id="c" width="540" height="1170"></canvas>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{const reduce=false;
/* ---------- The shared low-poly station ---------- */
const T=THREE,RW=540,RH=1170;
const r=new T.WebGLRenderer({canvas:document.getElementById('c'),antialias:true,preserveDrawingBuffer:true});r.setPixelRatio(1);r.setSize(RW,RH,false);
const scene=new T.Scene(),cam=new T.PerspectiveCamera(56,RW/RH,.1,160);
cam.position.set(.1,2.05,6.5);cam.lookAt(2.3,1.5,-30);   // a fixed camera: only the train moves
const C={out:{fog:0x0d1b33,lamp:0xd6f6ff,key:0x7fd8ff,amb:0x223a66,wall:0x3b5a8c,floor:0x58637f,edge:0xffd34d,inside:0xe6f4ff},
         home:{fog:0x2a1022,lamp:0xffd9a6,key:0xff8a4a,amb:0x5a2330,wall:0x8c4a3b,floor:0x7a5550,edge:0xffc46b,inside:0xfff0d6}};
scene.fog=new T.Fog(C.out.fog,10,100);scene.background=new T.Color(C.out.fog);
const mat=(c,o={})=>new T.MeshStandardMaterial(Object.assign({color:c,flatShading:true,roughness:.85,metalness:0},o));
const jag=(geo,a)=>{const p=geo.attributes.position;for(let i=0;i<p.count;i++){p.setXYZ(i,p.getX(i)+(Math.random()-.5)*a,p.getY(i)+(Math.random()-.5)*a,p.getZ(i)+(Math.random()-.5)*a);}geo.computeVertexNormals();return geo;};
const wallM=mat(C.out.wall),floorM=mat(C.out.floor),darkM=mat(0x0d0f18),edgeM=mat(C.out.edge,{emissive:C.out.edge,emissiveIntensity:.35});
const add=(geo,m,x,y,z,rx=0,ry=0)=>{const o=new T.Mesh(geo,m);o.position.set(x,y,z);o.rotation.set(rx,ry,0);scene.add(o);return o;};
add(jag(new T.PlaneGeometry(210,8,90,6),.35),wallM,-3.3,2.6,-95,0,Math.PI/2);
add(jag(new T.PlaneGeometry(16,210,8,90),.3),wallM,1.6,5.5,-95,Math.PI/2,0);
add(jag(new T.PlaneGeometry(210,7,90,5),.35),wallM,8.4,2.2,-95,0,-Math.PI/2);
add(jag(new T.BoxGeometry(6.02,1,210,6,1,90),.1),floorM,-.39,-.5,-95);   // the platform reaches the train (15 cm gap)
add(new T.BoxGeometry(.22,.05,210),edgeM,2.4,.02,-95);
add(new T.BoxGeometry(7,.4,210),darkM,4.6,-1.25,-95);
const railM=mat(0x8a93a8,{metalness:.4,roughness:.5});[3.45,5.0].forEach(x=>add(new T.BoxGeometry(.1,.12,210),railM,x,-.98,-95));
{const n=146,sl=new T.InstancedMesh(new T.BoxGeometry(2.4,.1,.35),mat(0x2b2420),n),m4=new T.Matrix4();for(let i=0;i<n;i++){m4.makeTranslation(4.22,-1.04,4-i*1.4);sl.setMatrixAt(i,m4);}scene.add(sl);}
const lamps=[];
const pillarM=mat(0x2a3048);
for(let i=0;i<24;i++){            // pillars and lights all the way down the platform
  const z=-8-i*6;
  if(i>1) add(jag(new T.CylinderGeometry(.32,.38,5.5,6,2),.05),pillarM,-2.5,2.2,z);   // (the first two make room for the escalators)
  const lm=add(new T.BoxGeometry(2,.07,.26),new T.MeshBasicMaterial({color:C.out.lamp}),.4,5.12,z);lamps.push(lm);
}
/* ---------- A busier station: markings, benches, bins, posters, signs, a clock, an escalator, stairs and people ---------- */
const signM=new T.MeshBasicMaterial({color:0x1d3f9a});
const extrasAt=(()=>{
  const LOOP=30;                                    // everything that moves repeats every 30 s, so the video loops
  const Z0=10,Z1=-200,L=Z0-Z1,ZC=(Z0+Z1)/2;
  const repaint=[];let painted=false;
  const tex=(w,h,draw)=>{const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');draw(x,w,h);const t=new T.CanvasTexture(c);t.anisotropy=4;repaint.push(()=>{x.clearRect(0,0,w,h);draw(x,w,h);t.needsUpdate=true;});return t;};
  const flat=(w,h,map,x,y,z,ry,basic)=>{const m=basic?new T.MeshBasicMaterial({map,transparent:true}):new T.MeshStandardMaterial({map,roughness:.8,transparent:true});const o=new T.Mesh(new T.PlaneGeometry(w,h),m);o.position.set(x,y,z);o.rotation.y=ry||0;scene.add(o);return o;};
  const hole=(cx,cz,w,d)=>{add(new T.BoxGeometry(w,1.4,d),mat(0x030405),cx,5.9,cz);                 // a real opening: dark, above the ceiling's bumps
    const trim=mat(0x7d8596,{metalness:.6,roughness:.35});add(new T.BoxGeometry(w+.1,.07,.07),trim,cx,5.2,cz+d/2);add(new T.BoxGeometry(w+.1,.07,.07),trim,cx,5.2,cz-d/2);
    add(new T.BoxGeometry(.07,.07,d),trim,cx-w/2,5.2,cz);add(new T.BoxGeometry(.07,.07,d),trim,cx+w/2,5.2,cz);};
  const floorStrip=(w,map,x)=>{const o=new T.Mesh(new T.PlaneGeometry(w,L),new T.MeshStandardMaterial({map,roughness:.9}));o.rotation.x=-Math.PI/2;o.position.set(x,.065,ZC);scene.add(o);};

  // The white guide line for blind people, and the black-and-white warning squares in front of it (towards the train).
  const check=tex(64,256,(x)=>{for(let i=0;i<2;i++)for(let j=0;j<8;j++){x.fillStyle=(i+j)%2?'#15171c':'#e9e8e2';x.fillRect(i*32,j*32,32,32);}});
  check.wrapS=check.wrapT=T.RepeatWrapping;check.repeat.set(1,L/2);floorStrip(.5,check,1.95);
  const ribs=tex(64,64,(x,w,h)=>{x.fillStyle='#ecebe5';x.fillRect(0,0,w,h);x.fillStyle='#aeada6';[8,24,40,56].forEach(v=>x.fillRect(v-3,0,6,h));});
  ribs.wrapS=ribs.wrapT=T.RepeatWrapping;ribs.repeat.set(1,L/.3);floorStrip(.3,ribs,1.3);

  // Benches and bins along the pillars.
  const benchM=mat(0x2a2f44),legM=mat(0x16181f,{metalness:.5,roughness:.5}),binM=mat(0x434b5e,{metalness:.35,roughness:.55}),binTopM=mat(0x1a1d26);
  const bench=z=>{add(new T.BoxGeometry(.5,.07,2.2),benchM,-2.0,.5,z);add(new T.BoxGeometry(.07,.5,2.2),benchM,-2.24,.78,z);[-.9,.9].forEach(o=>add(new T.BoxGeometry(.42,.5,.07),legM,-2.02,.25,z+o));};
  const bin=z=>{add(new T.CylinderGeometry(.21,.19,.75,10),binM,-1.98,.38,z);add(new T.CylinderGeometry(.23,.23,.07,10),binTopM,-1.98,.79,z);};
  for(let i=3;i<24;i++){const pz=-8-i*6;if(i%2) bench(pz+3);else bin(pz-1.1);}

  // Posters between the pillars, billboards on the far wall, the station's name, a clock and the exit.
  const P=[
    ['#f2a65a','#d9534f','VISIT BREDA','The city of Nassau',(x,w,h)=>{x.fillStyle='#2b1d2e';x.fillRect(w*.42,h*.2,w*.16,h*.5);x.beginPath();x.moveTo(w*.42,h*.2);x.lineTo(w*.5,h*.06);x.lineTo(w*.58,h*.2);x.fill();x.fillRect(w*.2,h*.5,w*.6,h*.2);}],
    ['#14213d','#3a5a99','EINDHOVEN','City of light',(x,w,h)=>{x.fillStyle='#fca311';x.beginPath();x.arc(w*.5,h*.38,w*.16,0,7);x.fill();x.strokeStyle='rgba(252,163,17,.6)';x.lineWidth=6;for(let a=0;a<12;a++){x.beginPath();x.moveTo(w*.5+Math.cos(a/12*6.28)*w*.22,h*.38+Math.sin(a/12*6.28)*w*.22);x.lineTo(w*.5+Math.cos(a/12*6.28)*w*.34,h*.38+Math.sin(a/12*6.28)*w*.34);x.stroke();}}],
    ['#2a9d8f','#264653','DEN BOSCH','Old town, new stories',(x,w,h)=>{x.fillStyle='#e9c46a';x.fillRect(w*.3,h*.3,w*.4,h*.38);x.beginPath();x.moveTo(w*.26,h*.3);x.lineTo(w*.5,h*.12);x.lineTo(w*.74,h*.3);x.fill();x.fillStyle='#264653';x.fillRect(w*.45,h*.5,w*.1,h*.18);}],
    ['#0f1428','#1d2c5a','HALTEWEKKER','Sleep. We wake you.',(x,w,h)=>{x.fillStyle='#f4c542';x.beginPath();x.arc(w*.5,h*.38,w*.2,0,7);x.fill();x.fillStyle='#1d2c5a';x.beginPath();x.arc(w*.58,h*.33,w*.18,0,7);x.fill();}],
    ['#90be6d','#43aa8b','BRABANT','By train, by bus',(x,w,h)=>{x.fillStyle='#f9c74f';x.beginPath();x.arc(w*.72,h*.22,w*.09,0,7);x.fill();x.fillStyle='#577590';x.beginPath();x.moveTo(0,h*.62);x.quadraticCurveTo(w*.35,h*.42,w,h*.6);x.lineTo(w,h*.72);x.lineTo(0,h*.72);x.fill();}],
    ['#e5e5e5','#bcb8b1','EXPO','Shapes & lines',(x,w,h)=>{[['#e63946',.32,.3,.16],['#457b9d',.62,.42,.2],['#f1c40f',.42,.58,.12]].forEach(([c,a,b,r])=>{x.fillStyle=c;x.beginPath();x.arc(w*a,h*b,w*r,0,7);x.fill();});}],
  ];
  const posterTex=(d,w,h)=>tex(w,h,(x)=>{const g=x.createLinearGradient(0,0,0,h);g.addColorStop(0,d[0]);g.addColorStop(1,d[1]);x.fillStyle=g;x.fillRect(0,0,w,h);d[4](x,w,h);
    x.fillStyle='rgba(0,0,0,.35)';x.fillRect(0,h*.76,w,h*.24);x.fillStyle='#fff';x.textAlign='center';
    x.font=`700 ${Math.round(Math.min(w,h*1.3)*.13)}px "Old Standard TT",Georgia,serif`;x.fillText(d[2],w/2,h*.87);
    x.font=`${Math.round(Math.min(w,h*1.3)*.06)}px "Courier Prime",monospace`;x.fillText(d[3],w/2,h*.95);
    x.strokeStyle='#d8c48a';x.lineWidth=6;x.strokeRect(3,3,w-6,h-6);});
  const posters=P.map(d=>posterTex(d,360,510)),boards=P.map(d=>posterTex(d,720,400));
  for(let i=2;i<22;i++){const z=-11-i*6;if(z>-20) continue;flat(1.15,1.65,posters[i%posters.length],-3.06,2.1,z,Math.PI/2);}
  for(let i=0;i<10;i++){flat(3.6,2.0,boards[(i+3)%boards.length],8.15,2.5,-8-i*10,-Math.PI/2);}
  // the station's name on enamel panels across the track, and a tiled band along both walls
  const plate=tex(512,128,(x,w,h)=>{x.fillStyle='#1d3f9a';x.fillRect(0,0,w,h);x.strokeStyle='#fff';x.lineWidth=6;x.strokeRect(8,8,w-16,h-16);x.fillStyle='#fff';x.font='700 58px Helvetica, Arial, sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText('HALTEWEKKER',w/2,h/2+3);});
  for(let i=0;i<10;i++){flat(2.2,.55,plate,8.15,2.9,-13-i*10,-Math.PI/2,true);}
  const tiles=tex(256,32,(x,w,h)=>{x.fillStyle='#c9cfd8';x.fillRect(0,0,w,h);x.fillStyle='#8f99a8';for(let i=0;i<w;i+=32)x.fillRect(i,0,2,h);x.fillRect(0,h-3,w,3);x.fillRect(0,0,w,2);});
  tiles.wrapS=T.RepeatWrapping;tiles.repeat.set(L/1.2,1);
  // (on your side it stops for the exit and the lift)
  [[8.17,-Math.PI/2,1.1,Z0,Z1],[-3.08,Math.PI/2,.95,Z0,-1.3],[-3.08,Math.PI/2,.95,-6.0,Z1]].forEach(([x,ry,y,za,zb])=>{const len=za-zb,tt=tiles.clone();tt.needsUpdate=true;tt.repeat.set(len/1.2,1);const o=new T.Mesh(new T.PlaneGeometry(len,.34),new T.MeshStandardMaterial({map:tt,roughness:.6}));o.position.set(x,y,(za+zb)/2);o.rotation.y=ry;scene.add(o);});
  const nameTex=tex(512,110,(x,w,h)=>{x.fillStyle='#fff';x.font='700 64px Helvetica, Arial, sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText('HALTEWEKKER',w/2,h/2+3);});
  for(let i=0;i<5;i++){const z=-29-i*18;add(new T.BoxGeometry(.06,.6,2.6),signM,-3.22,3.4,z);flat(2.4,.52,nameTex,-3.18,3.4,z,Math.PI/2,true);}
  // a hanging exit sign and a clock over the platform
  const exitTex=tex(512,120,(x,w,h)=>{x.fillStyle='#1b7a3d';x.fillRect(0,0,w,h);x.fillStyle='#fff';x.font='700 54px Helvetica, Arial, sans-serif';x.textBaseline='middle';x.fillText('← Uitgang · Exit',28,h/2+3);});
  add(new T.BoxGeometry(2.1,.48,.05),mat(0x0f1218),.7,4.55,-21);flat(2.0,.44,exitTex,.7,4.55,-20.97,0,true);
  [-.8,.8].forEach(o=>add(new T.BoxGeometry(.03,.75,.03),legM,.7+o,5.15,-21));
  const clockTex=tex(256,256,(x,w)=>{x.fillStyle='#f4f1e8';x.beginPath();x.arc(128,128,124,0,7);x.fill();x.strokeStyle='#14161b';x.lineWidth=10;x.stroke();
    for(let i=0;i<12;i++){const a=i/12*6.283;x.lineWidth=i%3?5:10;x.beginPath();x.moveTo(128+Math.sin(a)*96,128-Math.cos(a)*96);x.lineTo(128+Math.sin(a)*112,128-Math.cos(a)*112);x.stroke();}
    const hand=(a,len,wd)=>{x.lineWidth=wd;x.lineCap='round';x.beginPath();x.moveTo(128,128);x.lineTo(128+Math.sin(a)*len,128-Math.cos(a)*len);x.stroke();};hand((8+21/60)/12*6.283,58,11);hand(21/60*6.283,90,7);x.fillStyle='#c0392b';x.beginPath();x.arc(128,128,9,0,7);x.fill();});
  add(new T.CylinderGeometry(.36,.36,.08,24),mat(0x14161b,{metalness:.5,roughness:.4}),.7,4.15,-33,Math.PI/2);flat(.64,.64,clockTex,.7,4.15,-32.95,0,true);
  add(new T.BoxGeometry(.04,1.0,.04),legM,.7,4.9,-33);
  // the exit: a lit doorway in the wall near you
  add(new T.BoxGeometry(.24,2.7,2.2),mat(0x05060a),-3.22,1.35,-2.6);
  const runner=tex(256,128,(x,w,h)=>{x.fillStyle='#14a24a';x.fillRect(0,0,w,h);x.fillStyle='#fff';x.strokeStyle='#fff';x.lineCap='round';x.lineJoin='round';
    x.fillRect(156,18,64,92);x.fillStyle='#14a24a';x.fillRect(164,26,48,84);x.fillStyle='#fff';
    x.beginPath();x.arc(104,28,11,0,7);x.fill();x.lineWidth=13;
    [[[98,44],[84,76]],[[84,76],[106,90],[110,112]],[[84,76],[68,94],[48,94]],[[96,50],[118,60],[134,48]],[[96,50],[74,56],[62,44]]].forEach(pts=>{x.beginPath();pts.forEach(([a,b],i)=>i?x.lineTo(a,b):x.moveTo(a,b));x.stroke();});
    x.lineWidth=9;x.beginPath();x.moveTo(18,64);x.lineTo(44,64);x.stroke();x.beginPath();x.moveTo(30,52);x.lineTo(44,64);x.lineTo(30,76);x.stroke();});
  const exitSign=(x,y,z,ry)=>{add(new T.BoxGeometry(ry?.05:1.06,.56,ry?1.06:.05),mat(0x0f1218),x,y,z);flat(1.0,.5,runner,x+(ry?.03:0),y,z+(ry?0:.03),ry||0,true);};
  exitSign(-3.14,2.95,-2.6,Math.PI/2);exitSign(-3.14,2.95,-56,Math.PI/2);
  add(new T.BoxGeometry(1.06,.56,.05),mat(0x0f1218),.7,4.6,-48);flat(1.0,.5,runner,.7,4.6,-47.97,0,true);[-.4,.4].forEach(o=>add(new T.BoxGeometry(.03,.6,.03),legM,.7+o,5.15,-48));

  // A glass lift against the wall; its cabin goes up and down (someone gets in, someone comes out).
  const LX=-2.72,LZ=-4.85,LW=1.05,LD=1.9,LTOP=6.2;
  const liftFrame=mat(0x59627a,{metalness:.6,roughness:.35});
  [[-1,-1],[1,-1],[-1,1],[1,1]].forEach(([a,b])=>add(new T.BoxGeometry(.07,5.5,.07),liftFrame,LX+a*LW/2,2.75,LZ+b*LD/2));
  const liftGlass=new T.MeshStandardMaterial({color:0xa9d2ff,transparent:true,opacity:.16,roughness:.1,metalness:.2,depthWrite:false});
  add(new T.BoxGeometry(.02,5.5,LD),liftGlass,LX+LW/2,2.75,LZ);hole(LX,LZ,LW+.1,LD+.1);add(new T.BoxGeometry(LW,5.5,.02),liftGlass,LX,2.75,LZ+LD/2);add(new T.BoxGeometry(LW,5.5,.02),liftGlass,LX,2.75,LZ-LD/2);
  const cab=new T.Group();scene.add(cab);
  const cabM=new T.MeshStandardMaterial({color:0xf3e2c0,emissive:0xffcf8a,emissiveIntensity:.6,roughness:.6});
  const cf=new T.Mesh(new T.BoxGeometry(LW-.12,.08,LD-.12),liftFrame);cab.add(cf);
  const cr=new T.Mesh(new T.BoxGeometry(LW-.12,.08,LD-.12),cabM);cr.position.y=2.3;cab.add(cr);
  const cbk=new T.Mesh(new T.BoxGeometry(.04,2.3,LD-.12),cabM);cbk.position.set(-LW/2+.08,1.15,0);cab.add(cbk);
  const cabGlass=new T.MeshStandardMaterial({color:0xffe6b8,emissive:0xffcf8a,emissiveIntensity:.35,transparent:true,opacity:.38,roughness:.2,depthWrite:false});
  [-1,1].forEach(sd=>{const w=new T.Mesh(new T.BoxGeometry(LW-.12,2.3,.04),cabGlass);w.position.set(0,1.15,sd*(LD/2-.08));cab.add(w);});
  const door=new T.Mesh(new T.BoxGeometry(.05,2.36,.08),liftFrame);[-1,1].forEach(sd=>{const d=door.clone();d.position.set(LW/2-.06,1.15,sd*.42);cab.add(d);});
  cab.position.set(LX,0,LZ);
  const liftIcon=tex(128,128,(x,w,h)=>{x.fillStyle='#1d4f9a';x.fillRect(0,0,w,h);x.fillStyle='#fff';x.fillRect(30,22,68,84);x.fillStyle='#1d4f9a';x.fillRect(38,30,52,68);x.fillStyle='#fff';
    x.beginPath();x.moveTo(64,36);x.lineTo(76,52);x.lineTo(52,52);x.fill();x.beginPath();x.moveTo(64,92);x.lineTo(76,76);x.lineTo(52,76);x.fill();});
  flat(.4,.4,liftIcon,LX+LW/2+.03,2.75,LZ+LD/2-.3,Math.PI/2,true);
  const sstep=u=>u<=0?0:u>=1?1:u*u*(3-2*u);
  const cabY=t=>t<6?0:t<11?LTOP*sstep((t-6)/5):t<19?LTOP:t<24?LTOP*(1-sstep((t-19)/5)):0;

  // Glowing boards over the platform with the next transfers. The nearest one is left blank: the app writes
  // your real connections on it (the website draws them right into the scene).
  const drawBoard=(x,w,h,rows,title)=>{x.fillStyle='#06122b';x.fillRect(0,0,w,h);
    x.textBaseline='middle';x.fillStyle='#ffb43a';x.font='700 26px "Courier Prime",monospace';if(title) x.fillText(title,18,26);
    x.fillStyle='rgba(255,180,58,.35)';x.fillRect(18,46,w-36,2);
    (rows||[]).slice(0,3).forEach((r,i)=>{const y=76+i*34;x.font='700 25px "Courier Prime",monospace';x.fillStyle='#fff';x.textAlign='left';x.fillText(String(r.line).slice(0,4),18,y);x.fillText(String(r.to).slice(0,14),100,y);
      x.textAlign='right';x.fillText(r.time,w-(r.note?96:18),y);if(r.note){x.fillStyle='#ffb43a';x.fillText(String(r.note).slice(0,5),w-18,y);}x.textAlign='left';});};
  let liveRows=null;
  const liveBoard=tex(512,176,(x,w,h)=>drawBoard(x,w,h,liveRows,liveRows?'NEXT TRANSFERS':''));
  window.stationBoard=rows=>{liveRows=rows&&rows.length?rows:null;drawBoard(liveBoard.image.getContext('2d'),512,176,liveRows,liveRows?'NEXT TRANSFERS':'');liveBoard.needsUpdate=true;if(window.__stageKick) window.__stageKick();};
  const sample=tex(512,176,(x,w,h)=>drawBoard(x,w,h,[{line:'IC',to:'Breda',time:'08:41'},{line:'305',to:'Eindhoven',time:'08:47',note:'+2'},{line:'SPR',to:'Tilburg',time:'08:52'}],'DEPARTURES'));
  const BOARD={x:1.2,y:4.3,w:2.56,h:.86};
  const hangBoard=(z,map)=>{add(new T.BoxGeometry(BOARD.w+.14,BOARD.h+.12,.14),mat(0x0b0c10,{metalness:.5,roughness:.4}),BOARD.x,BOARD.y,z);
    const scr=new T.Mesh(new T.PlaneGeometry(BOARD.w,BOARD.h),new T.MeshBasicMaterial({map}));scr.position.set(BOARD.x,BOARD.y,z+.075);scene.add(scr);
    [-1.0,1.0].forEach(o=>add(new T.BoxGeometry(.03,.75,.03),legM,BOARD.x+o,5.15,z));};
  hangBoard(-8,liveBoard);hangBoard(-40,sample);hangBoard(-72,sample);
  // Where the live board sits on screen from the platform camera (0…1 of the picture), for the app to write on it.
  window.boardRect=()=>{const c=cam.clone();c.position.set(.1,2.05,6.5);c.lookAt(2.3,1.5,-30);c.updateMatrixWorld();
    const pts=[[-1,-1],[1,-1],[-1,1],[1,1]].map(([a,b])=>new T.Vector3(BOARD.x+a*BOARD.w/2,BOARD.y+b*BOARD.h/2,-8+.075).project(c));

const insideM=sideMs[0];   // used by the lighting
function car(i,lead,tail){
  const g=new T.Group();g.position.z=-i*(CAR+GAP);train.add(g);
  const core=new T.Mesh(new T.BoxGeometry(CW,CH,CAR),steelM);core.position.set(0,CH/2,-CAR/2);g.add(core);
  const side=new T.Mesh(new T.PlaneGeometry(CAR,CH),sideMs[i%2]);side.rotation.y=-Math.PI/2;side.position.set(-CW/2-.004,CH/2,-CAR/2);g.add(side);
  const roof=new T.Mesh(new T.BoxGeometry(CW-.3,.14,CAR-.3),roofM);roof.position.set(0,CH+.07,-CAR/2);g.add(roof);
  [-.2,-.5,-.8].forEach(f=>{const ac=new T.Mesh(new T.BoxGeometry(1.5,.32,1.8),acM);ac.position.set(0,CH+.3,CAR*f);g.add(ac);});
  const und=new T.Mesh(new T.BoxGeometry(CW-.4,.45,CAR-3.4),underM);und.position.set(0,-.2,-CAR/2);g.add(und);
  [-2.4,-CAR+2.4].forEach(bz=>{const b=new T.Mesh(new T.BoxGeometry(2.2,.38,2.5),underM);b.position.set(0,-.52,bz);g.add(b);
    [-.75,.75].forEach(o=>{const w=new T.Mesh(new T.CylinderGeometry(.4,.4,.16,10),wheelM);w.rotation.z=Math.PI/2;w.position.set(-1.15,-.62,bz+o);g.add(w);});});
  if(lead){const f=new T.Mesh(new T.PlaneGeometry(CW,CH),frontM);f.position.set(0,CH/2,.004);g.add(f);}
  if(tail){const r=new T.Mesh(new T.PlaneGeometry(CW,CH),rearM);r.rotation.y=Math.PI;r.position.set(0,CH/2,-CAR-.004);g.add(r);}
  if(!lead){const gw=new T.Mesh(new T.BoxGeometry(1.9,2.4,GAP+.1),underM);gw.position.set(0,1.4,GAP/2);g.add(gw);}

[0,1,2,3].forEach(i=>car(i,i===0,i===3));
const glowTex=(()=>{const c=document.createElement('canvas');c.width=c.height=64;const x=c.getContext('2d'),gg=x.createRadialGradient(32,32,0,32,32,32);gg.addColorStop(0,'rgba(255,246,220,1)');gg.addColorStop(1,'rgba(255,246,220,0)');x.fillStyle=gg;x.fillRect(0,0,64,64);return new T.CanvasTexture(c);})();
[-1.03,1.03].forEach(hx=>{const glow=new T.Sprite(new T.SpriteMaterial({map:glowTex,blending:T.AdditiveBlending,depthWrite:false,transparent:true,opacity:.8}));glow.scale.set(1.8,1.1,1);glow.position.set(hx,.74,.3);train.add(glow);});
train.position.set(4.22,.55,-150);

// Pull in, slow down, stop, wait, leave.
const STOP=-4,FAR=-150,GONE=150;
const plan=[{d:9,from:FAR,to:STOP,ease:t=>1-Math.pow(1-t,3)},{d:7,from:STOP,to:STOP,ease:t=>t},{d:8,from:STOP,to:GONE,ease:t=>t*t*t},{d:6,from:GONE,to:GONE,ease:t=>t}];
let phase=0,phaseAt=performance.now();
function trainZ(now){
  if(reduce) return STOP;
  let p=plan[phase],t=(now-phaseAt)/1000/p.d;
  if(t>=1){phase=(phase+1)%plan.length;phaseAt=now;p=plan[phase];t=0;if(phase===0) train.position.z=FAR;}
  return p.from+(p.to-p.from)*p.ease(Math.min(1,t));
}

const tmp=new T.Color(),ca=new T.Color(),cb=new T.Color();
const lerpC=(a,b,t)=>tmp.copy(ca.setHex(a)).lerp(cb.setHex(b),t);
function light(t){
  const o=C.out,h=C.home;
  scene.fog.color.copy(lerpC(o.fog,h.fog,t));scene.background.copy(scene.fog.color);
  lamps.forEach(l=>l.material.color.copy(lerpC(o.lamp,h.lamp,t)));
  keyL.forEach(l=>l.color.copy(lerpC(o.key,h.key,t)));amb.color.copy(lerpC(o.amb,h.amb,t));
  wallM.color.copy(lerpC(o.wall,h.wall,t));floorM.color.copy(lerpC(o.floor,h.floor,t));
  edgeM.color.copy(lerpC(o.edge,h.edge,t));edgeM.emissive.copy(edgeM.color);
  const ins=lerpC(o.inside,h.inside,t);sideMs.forEach(m=>m.emissive.copy(ins));signM.color.copy(lerpC(0x1d3f9a,0x9a2f1d,t));
}


/* ---------- The metro map on the wall (the home screen's menu) ---------- */
const PW=.78,PH=PW*562/346,PX0=-3.02,PZ=1.6,PY=2.12;
function paintMap(home){
  // A Berlin-style network map: white paper, bold colour lines at 45°, white interchange markers, line badges.
  const W=780,H=Math.round(W*562/346),k=W/346,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
  const P=home?{brass:'#C9965A',line:'#76523A',acc:'#7A2A1E'}:{brass:'#B9A066',line:'#5E5A44',acc:'#1D2C5A'};
  const SANS='Helvetica Neue, Helvetica, Arial, sans-serif';
  x.fillStyle='#F7F5EF';x.fillRect(0,0,W,H);
  x.strokeStyle=P.line;x.lineWidth=1*k;x.strokeRect(4*k,4*k,W-8*k,H-8*k);x.strokeStyle=P.brass;x.lineWidth=1.5*k;x.strokeRect(7*k,7*k,W-14*k,H-14*k);
  [[7,7],[339,7],[7,555],[339,555]].forEach(([a,b])=>{x.beginPath();x.moveTo(a*k,(b-5)*k);x.lineTo((a+5)*k,b*k);x.lineTo(a*k,(b+5)*k);x.lineTo((a-5)*k,b*k);x.closePath();x.fillStyle='#F7F5EF';x.fill();x.stroke();});
  const TX=(t,px,py,size,col,weight,al,base)=>{x.font=`${weight||400} ${size*k}px ${SANS}`;x.fillStyle=col;x.textAlign=al||'left';x.textBaseline=base||'alphabetic';x.fillText(t,px*k,py*k);};
  const rr=(a,b,w,h,r)=>{x.beginPath();x.moveTo((a+r)*k,b*k);x.arcTo((a+w)*k,b*k,(a+w)*k,(b+h)*k,r*k);x.arcTo((a+w)*k,(b+h)*k,a*k,(b+h)*k,r*k);x.arcTo(a*k,(b+h)*k,a*k,b*k,r*k);x.arcTo(a*k,b*k,(a+w)*k,b*k,r*k);x.closePath();};
  // header
  TX('Haltewekker',20,44,24,'#1D1D1B',700);
  TX('Network map · Veghel ⇄ Breda',20,60,10.5,'#6B6B6B',400);
  x.strokeStyle='#1D1D1B';x.lineWidth=1.5*k;x.beginPath();x.arc(314*k,38*k,15*k,0,7);x.stroke();
  // direction: two badges, the one you're going is filled
  [['TO BREDA',20,!home],['HOME',126,home]].forEach(([t,bx,on])=>{rr(bx,72,100,28,4);if(on){x.fillStyle=P.acc;x.fill();}else{x.strokeStyle='#B9B5AA';x.lineWidth=1.2*k;x.stroke();}
    TX(t,bx+50,86,12.5,on?'#FFFFFF':'#8A877F',700,'center','middle');});
  TX('tap to switch',234,86,9.5,'#8A877F',400,'left','middle');
  // the network
  const ox=14,oy=108,X=v=>(ox+v)*k,Y=v=>(oy+v)*k;
  const path=(pts,col,w)=>{x.strokeStyle=col;x.lineWidth=w*k;x.lineCap='round';x.lineJoin='round';x.beginPath();pts.forEach(([a,b],i)=>i?x.lineTo(X(a),Y(b)):x.moveTo(X(a),Y(b)));x.stroke();};
  const viaDB=[[46,110],[128,110],[188,46],[228,46],[292,110]];
  path(viaDB,'rgba(255,214,64,.55)',14);path([[46,110],[46,178]],'rgba(255,214,64,.55)',14);   // your fastest route, highlighted
  path([[46,106.5],[128,106.5],[188,46.5],[214,46.5]],'#224F86',5);
  path([[46,113.5],[128,113.5],[188,173.5],[214,173.5]],'#528DBA',5);
  path([[214,46],[228,46],[292,110]],'#DA421E',5);
  path([[214,174],[228,174],[292,110]],'#F3791D',5);
  path([[46,110],[46,178]],'#8C6DAB',5);
  const ring=(a,b,r)=>{x.fillStyle='#fff';x.strokeStyle='#1D1D1B';x.lineWidth=2*k;x.beginPath();x.arc(X(a),Y(b),r*k,0,7);x.fill();x.stroke();};
  const pill=(a,b,w,h)=>{rr(ox+a-w/2,oy+b-h/2,w,h,w/2);x.fillStyle='#fff';x.fill();x.strokeStyle='#1D1D1B';x.lineWidth=2*k;x.stroke();};
  pill(46,110,13,22);pill(128,110,13,22);ring(214,46,6);ring(214,174,6);ring(292,110,7);ring(46,178,6);
  const lab=(t,a,b,al,base)=>TX(t,ox+a,oy+b,11,'#1D1D1B',700,al,base);
  lab('Breda',46,96,'center','alphabetic');lab('BUas',58,178,'left','middle');lab('Tilburg',128,126,'center','top');
  lab('Den Bosch',214,36,'center','alphabetic');lab('Eindhoven',214,184,'center','top');lab('Veghel',292,96,'center','alphabetic');
  const badge=(t,cx,cy,col,ink)=>{const w=t.length*7+10;rr(ox+cx-w/2,oy+cy-7.5,w,15,3);x.fillStyle=col;x.fill();TX(t,ox+cx,oy+cy+.5,9.5,ink||'#fff',700,'center','middle');};
  badge('306',274,66,'#DA421E');badge('305',274,154,'#F3791D');badge('IC',146,62,'#224F86');badge('IC',146,158,'#528DBA');badge('BUS',72,144,'#8C6DAB');
  // the menu: pick a line
  TX('PICK A LINE',20,342,9,'#8A877F',700);
  const rows=[['F','Fastest trip','Your next connection, door to door','#F0D722','#1D1D1B'],['A','All lines','Every bus and train, live','#7DAD4C','#fff'],['P','Planned trip','Travel with your friend’s train','#7E5330','#fff']];
  rows.forEach(([l,t,s,col,ink],i)=>{const y0=350+i*58;
    rr(20,y0+12,40,28,4);x.fillStyle=col;x.fill();TX(l,40,y0+26.5,16,ink,700,'center','middle');
    TX(t,72,y0+23,16,'#1D1D1B',700);TX(s,72,y0+39,10.5,'#6B6B6B',400);
    x.strokeStyle='#8A877F';x.lineWidth=2*k;x.beginPath();x.moveTo(318*k,(y0+20)*k);x.lineTo(324*k,(y0+26)*k);x.lineTo(318*k,(y0+32)*k);x.stroke();
    x.fillStyle='#DDD9CE';x.fillRect(20*k,(y0+52)*k,306*k,1*k);});
  rr(20,524,22,16,3);x.fillStyle='#8E8E8E';x.fill();TX('M',31,532.5,10,'#fff',700,'center','middle');
  TX('More · leaderboard, single stop, tips',50,536,10.5,'#3A3A38',400);
  const t=new T.CanvasTexture(c);t.anisotropy=8;return t;
}
let mapTex=null;   // painted once the fonts are in
const posterM=new T.MeshBasicMaterial({color:0xffffff});
const poster=new T.Mesh(new T.PlaneGeometry(PW,PH),posterM);poster.rotation.y=Math.PI/2;poster.position.set(PX0+.035,PY,PZ);scene.add(poster);
const frameM=mat(0x8a6a30,{metalness:.6,roughness:.35,emissive:0x2a1d08});
const fr=new T.Mesh(new T.BoxGeometry(.05,PH+.07,PW+.07),frameM);fr.position.set(PX0,PY,PZ);scene.add(fr);
// a small brass lamp over the map
add(new T.BoxGeometry(.07,.025,.3),frameM,PX0+.06,PY+PH/2+.09,PZ);add(new T.BoxGeometry(.012,.07,.012),frameM,PX0+.03,PY+PH/2+.065,PZ-.1);add(new T.BoxGeometry(.012,.07,.012),frameM,PX0+.03,PY+PH/2+.065,PZ+.1);
const mapLamp=new T.PointLight(0xfff0d0,.8,3,2);mapLamp.position.set(PX0+.45,PY+PH/2+.05,PZ);scene.add(mapLamp);

/* ---------- The camera: face to face with the map, then back away and turn to the platform ---------- */
const CM={p:new T.Vector3(PX0+1.75,PY,PZ),yaw:-Math.PI/2,pitch:0};
const CS={p:new T.Vector3(.1,2.05,6.5)};{const d=new T.Vector3(2.3,1.5,-30).sub(CS.p).normalize();CS.yaw=Math.atan2(d.x,-d.z);CS.pitch=Math.asin(d.y);}
const CC=new T.Vector3(.45,2.1,2.4);
const ease=u=>u<.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2;
function camAt(u){
  const e=ease(u),a=1-e;
  const p=CM.p.clone().multiplyScalar(a*a).add(CC.clone().multiplyScalar(2*a*e)).add(CS.p.clone().multiplyScalar(e*e));
  const ty=ease(Math.min(1,Math.max(0,(u-.1)/.9)));
  const yaw=CM.yaw+(CS.yaw-CM.yaw)*ty,pitch=CM.pitch+(CS.pitch-CM.pitch)*ty;
  cam.position.copy(p);cam.lookAt(p.clone().add(new T.Vector3(Math.sin(yaw)*Math.cos(pitch),Math.sin(pitch),-Math.cos(yaw)*Math.cos(pitch))));
}
// Where the map sits on screen in the first frame (0…1 of the picture), for the app to put its own map there.
window.posterRect=()=>{camAt(0);cam.updateMatrixWorld();const pts=[[-1,-1],[1,-1],[-1,1],[1,1]].map(([s,t])=>new T.Vector3(PX0+.04,PY+t*PH/2,PZ+s*PW/2).project(cam));
  const xs=pts.map(p=>(p.x+1)/2),ys=pts.map(p=>(1-p.y)/2);return {x0:Math.min(...xs),x1:Math.max(...xs),y0:Math.min(...ys),y1:Math.max(...ys)};};
window.renderMove=(u,mix)=>{if(!mapTex) mapTex=[paintMap(false),paintMap(true)];light(mix);posterM.map=mapTex[mix>.5?1:0];posterM.needsUpdate=true;train.position.z=zAt(0);extrasAt(-1.6+u*1.6);camAt(u);r.render(scene,cam);return r.domElement.toDataURL('image/jpeg',0.9);};
// Deterministic train position for a time t (seconds) in the 30 s loop.
function zAt(t){let acc=0;for(const p of plan){if(t<acc+p.d){const u=(t-acc)/p.d;return p.from+(p.to-p.from)*p.ease(u);}acc+=p.d;}return plan[0].from;}
window.renderFrame=(t,mix)=>{light(mix);train.position.z=zAt(t%30);extrasAt(t);r.render(scene,cam);return r.domElement.toDataURL('image/jpeg',0.9);};
window.ready=true;
})();
