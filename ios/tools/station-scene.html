<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Old+Standard+TT:wght@700&family=Courier+Prime&display=block"><style>html,body{margin:0;background:#000}</style></head><body>
<canvas id="c" width="540" height="1170"></canvas>

(()=>{const reduce=false;

{const n=146,sl=new T.InstancedMesh(new T.BoxGeometry(2.4,.1,.35),mat(0x2b2420),n),m4=new T.Matrix4();for(let i=0;i<n;i++){m4.makeTranslation(4.22,-1.04,4-i*1.4);sl.setMatrixAt(i,m4);}scene.add(sl);}

  const flat=(w,h,map,x,y,z,ry,basic)=>{const m=basic?new T.MeshBasicMaterial({map,transparent:true}):new T.MeshStandardMaterial({map,roughness:.8,transparent:true});const o=new T.Mesh(new T.PlaneGeometry(w,h),m);o.position.set(x,y,z);o.rotation.y=ry||0;scene.add(o);return o;};
  const hole=(cx,cz,w,d)=>{add(new T.BoxGeometry(w,1.4,d),mat(0x030405),cx,5.9,cz);                 // a real opening: dark, above the ceiling's bumps

    ['#14213d','#3a5a99','EINDHOVEN','City of light',(x,w,h)=>{x.fillStyle='#fca311';x.beginPath();x.arc(w*.5,h*.38,w*.16,0,7);x.fill();x.strokeStyle='rgba(252,163,17,.6)';x.lineWidth=6;for(let a=0;a<12;a++){x.beginPath();x.moveTo(w*.5+Math.cos(a/12*6.28)*w*.22,h*.38+Math.sin(a/12*6.28)*w*.22);x.lineTo(w*.5+Math.cos(a/12*6.28)*w*.34,h*.38+Math.sin(a/12*6.28)*w*.34);x.stroke();}}],

    ['#0f1428','#1d2c5a','HALTEWEKKER','Sleep. We wake you.',(x,w,h)=>{x.fillStyle='#f4c542';x.beginPath();x.arc(w*.5,h*.38,w*.2,0,7);x.fill();x.fillStyle='#1d2c5a';x.beginPath();x.arc(w*.58,h*.33,w*.18,0,7);x.fill();}],

  const nameTex=tex(512,110,(x,w,h)=>{x.fillStyle='#fff';x.font='700 64px Helvetica, Arial, sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText('HALTEWEKKER',w/2,h/2+3);});
  for(let i=0;i<5;i++){const z=-29-i*18;add(new T.BoxGeometry(.06,.6,2.6),signM,-3.22,3.4,z);flat(2.4,.52,nameTex,-3.18,3.4,z,Math.PI/2,true);}
  // a hanging exit sign and a clock over the platform

  add(new T.BoxGeometry(2.1,.48,.05),mat(0x0f1218),.7,4.55,-21);flat(2.0,.44,exitTex,.7,4.55,-20.97,0,true);

  const clockTex=tex(256,256,(x,w)=>{x.fillStyle='#f4f1e8';x.beginPath();x.arc(128,128,124,0,7);x.fill();x.strokeStyle='#14161b';x.lineWidth=10;x.stroke();
    for(let i=0;i<12;i++){const a=i/12*6.283;x.lineWidth=i%3?5:10;x.beginPath();x.moveTo(128+Math.sin(a)*96,128-Math.cos(a)*96);x.lineTo(128+Math.sin(a)*112,128-Math.cos(a)*112);x.stroke();}
    const hand=(a,len,wd)=>{x.lineWidth=wd;x.lineCap='round';x.beginPath();x.moveTo(128,128);x.lineTo(128+Math.sin(a)*len,128-Math.cos(a)*len);x.stroke();};hand((8+21/60)/12*6.283,58,11);hand(21/60*6.283,90,7);x.fillStyle='#c0392b';x.beginPath();x.arc(128,128,9,0,7);x.fill();});
  add(new T.CylinderGeometry(.36,.36,.08,24),mat(0x14161b,{metalness:.5,roughness:.4}),.7,4.15,-33,Math.PI/2);flat(.64,.64,clockTex,.7,4.15,-32.95,0,true);
  add(new T.BoxGeometry(.04,1.0,.04),legM,.7,4.9,-33);
  // Emergency exit signs: the green running man.
  const runner=tex(256,128,(x,w,h)=>{x.fillStyle='#14a24a';x.fillRect(0,0,w,h);x.fillStyle='#fff';x.strokeStyle='#fff';x.lineCap='round';x.lineJoin='round';
    x.fillRect(156,18,64,92);x.fillStyle='#14a24a';x.fillRect(164,26,48,84);x.fillStyle='#fff';

    x.lineWidth=9;x.beginPath();x.moveTo(18,64);x.lineTo(44,64);x.stroke();x.beginPath();x.moveTo(30,52);x.lineTo(44,64);x.lineTo(30,76);x.stroke();});
  const exitSign=(x,y,z,ry)=>{add(new T.BoxGeometry(ry?.05:1.06,.56,ry?1.06:.05),mat(0x0f1218),x,y,z);flat(1.0,.5,runner,x+(ry?.03:0),y,z+(ry?0:.03),ry||0,true);};
  exitSign(-3.14,2.95,-56,Math.PI/2);
  add(new T.BoxGeometry(1.06,.56,.05),mat(0x0f1218),.7,4.6,-48);flat(1.0,.5,runner,.7,4.6,-47.97,0,true);[-.4,.4].forEach(o=>add(new T.BoxGeometry(.03,.6,.03),legM,.7+o,5.15,-48));
  // In the wall near you: a cream tiled wall with the emergency exit door and a stainless-steel lift

  const FX=-2.72,BZ0=-1.0,BZ1=-6.3,LZ=-2.1,EZ=-4.9,DW=.6,OPEN=.62,OH=2.24;   // lift by the map, emergency exit by the escalators
  const cream=(len,h)=>{const t=tex(256,256,(x,w,hh)=>{x.fillStyle='#e9e4d8';x.fillRect(0,0,w,hh);x.strokeStyle='rgba(150,140,120,.22)';x.lineWidth=1.4;

  const tileBox=(dx,h,dz,x,y,z)=>add(new T.BoxGeometry(dx,h,dz),cream(Math.max(dx,dz),h),x,y,z);
  const D=FX+3.3;                                                                       // how far the lift wall stands out
  tileBox(.06,3.2-2.3,BZ0-BZ1,FX-.03,2.75,(BZ0+BZ1)/2);                               // above the doors
  tileBox(.06,2.3,BZ0-(LZ+OPEN),FX-.03,1.15,(BZ0+LZ+OPEN)/2);                           // beside the opening

  tileBox(D,3.2,.06,FX-D/2,1.6,BZ0);tileBox(D,3.2,.06,FX-D/2,1.6,BZ1);                  // the ends

  // brushed steel with the polished pattern of the doors

    for(let i=0;i<w;i+=2){x.fillStyle=`rgba(255,255,255,${((i*37)%11)/110})`;x.fillRect(i,0,1,h);}

  add(new T.BoxGeometry(CD,.02,OPEN*2),new T.MeshStandardMaterial({map:marble,roughness:.3}),CB+CD/2,.012,LZ);

  add(new T.BoxGeometry(.1,OH+.2,.14),frameM,FX+.02,(OH+.2)/2,LZ-OPEN-.07);add(new T.BoxGeometry(.1,OH+.2,.14),frameM,FX+.02,(OH+.2)/2,LZ+OPEN+.07);

/* ---------- The camera: face to face with the map, then back away and turn to the platform ---------- */
const CM={p:new T.Vector3(PX0+1.75,PY,PZ),yaw:-Math.PI/2,pitch:0};
const CS={p:new T.Vector3(.1,2.05,6.5)};{const d=new T.Vector3(2.3,1.5,-30).sub(CS.p).normalize();CS.yaw=Math.atan2(d.x,-d.z);CS.pitch=Math.asin(d.y);}
const CC=new T.Vector3(.45,2.1,2.4);
const ease=u=>u<.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2;
function camAt(u){
  const e=ease(u),a=1-e;
  const p=CM.p.clone().multiplyScalar(a*a).add(CC.clone().multiplyScalar(2*a*e)).add(CS.p.clone().multiplyScalar(e*e));
  const ty=ease(Math.min(1,Math.max(0,(u-.1)/.9)));
  const yaw=CM.yaw+(CS.yaw-CM.yaw)*ty,pitch=CM.pitch+(CS.pitch-CM.pitch)*ty;
  cam.position.copy(p);cam.lookAt(p.clone().add(new T.Vector3(Math.sin(yaw)*Math.cos(pitch),Math.sin(pitch),-Math.cos(yaw)*Math.cos(pitch))));
}
// Where the map sits on screen in the first frame (0…1 of the picture), for the app to put its own map there.
window.posterRect=()=>{camAt(0);cam.updateMatrixWorld();const pts=[[-1,-1],[1,-1],[-1,1],[1,1]].map(([s,t])=>new T.Vector3(PX0+.04,PY+t*PH/2,PZ+s*PW/2).project(cam));
  const xs=pts.map(p=>(p.x+1)/2),ys=pts.map(p=>(1-p.y)/2);return {x0:Math.min(...xs),x1:Math.max(...xs),y0:Math.min(...ys),y1:Math.max(...ys)};};
window.peekLift=(t,c)=>{if(!mapTex) mapTex=[paintMap(false),paintMap(true)];light(0);extrasAt(t);c=c||[.2,1.7,-4.9,-3,1.4,-4.9];cam.position.set(c[0],c[1],c[2]);cam.lookAt(c[3],c[4],c[5]);r.render(scene,cam);return r.domElement.toDataURL('image/jpeg',0.9);};

// Deterministic train position for a time t (seconds) in the 30 s loop.
function zAt(t){let acc=0;for(const p of plan){if(t<acc+p.d){const u=(t-acc)/p.d;return p.from+(p.to-p.from)*p.ease(u);}acc+=p.d;}return plan[0].from;}
